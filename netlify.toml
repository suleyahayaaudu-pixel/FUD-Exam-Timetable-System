[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "build"

[build.environment]
  # Create React App treats lint warnings as errors when CI=true
  CI = "false"

# Single-page app: route all paths to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
